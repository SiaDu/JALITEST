maya_common:
  repo_root: .
  maya_project_root: E:/maya_project/JALI_test

# Native JALI creation defaults. Language/style remain study-frozen; the
# Advanced / Debug UI can override the silence settings before animation.
maya_jali_speech_base:
  language_code: 0
  # JALI 2.18: Normal Conversation (mid Lip + mid Jaw), matching the
  # native Animate from File dialog used for the study rigs.
  speech_style: 4
  filter_silence_gaps: true
  silence_threshold_db: -35.0
  sequence_overrides:
    Seq3:
      silence_threshold_db: -60.0

maya_gaze:
  eye_stare_node_suffix: eyeStare_world
  clear_existing_eye_stare_translate_keys: true
  gaze_transition_frames: 3
  glance_hold_seconds: 0.5
  glance_transition_frames: 3
  short_glance_policy: shorten_or_drop
  short_glance_min_hold_frames: 1
  directional_eye_magnitude: 5
  directional_eye_limit: 6
  apply_weighted_flat_tangents: true

  # Gaze targets are supplied through the Performance Plan UI's scene mapping
  # and look-at calibration workflow.
  dynamic_target_locator_group: JALITEST_gaze_targets_GRP
  dynamic_target_locator_size: 4.0
  dynamic_target_locator_suffix: _lookat_LOC
  dynamic_target_locator_role_offsets:
    CHARACTER: [-35.0, 0.0, 0.0]
    OBJECT: [35.0, -10.0, 0.0]
    EXPLICIT: [0.0, 0.0, 0.0]

  dynamic_target_locator_offsets:
    DOROTHY: [-35.0, 0.0, 0.0]
    CHARACTER_DOROTHY: [-35.0, 0.0, 0.0]
    CRYSTAL: [0.0, -22.0, 0.0]
    OBJECT_CRYSTAL: [0.0, -22.0, 0.0]
    PHOTOGRAPH: [35.0, -10.0, 0.0]
    OBJECT_PHOTOGRAPH: [35.0, -10.0, 0.0]

  # Lower JALI ambient gaze so ExpreGaze's eyeStare_world overlay is readable.
  # jali_attribute_overrides:
  #   jSync1:
  #     ambient_gaze_intensity: 1

  direction_offsets:
    DOWN: [0.0, -25.0, 0.0]
    DOWN_LEFT: [-40.0, -25.0, 0.0]
    DOWN_RIGHT: [40.0, -25.0, 0.0]
    UP: [0.0, 25.0, 0.0]
    UP_LEFT: [-40.0, 25.0, 0.0]
    UP_RIGHT: [40.0, 25.0, 0.0]
    LEFT: [-40.0, 0.0, 0.0]
    RIGHT: [40.0, 0.0, 0.0]

maya_eye_performance:
  eyelid_control_suffix: LIDS_jSync_plusMinus
  eyelid_attr: Down_upLids_jSync

  default_lid_state: 0.0
  clear_existing_eyelid_keys: true
  lid_state_transition_frames: 8
  apply_weighted_flat_tangents: true

  blink_presets:
    SINGLE_BLINK:
      closure: 7
      close_frames: 2
      hold_frames: 1
      open_frames: 2
      count: 1
      gap_frames: 0
    VERY_SUBTLE_BLINK:
      closure: 4
      close_frames: 1
      hold_frames: 1
      open_frames: 1
      count: 1
      gap_frames: 0
    DOUBLE_BLINK:
      closure: 7
      close_frames: 2
      hold_frames: 1
      open_frames: 2
      count: 2
      gap_frames: 4
    BLINK_CLUSTER:
      closure: 6
      close_frames: 1
      hold_frames: 1
      open_frames: 2
      count: 3
      gap_frames: 3
    EYE_CLOSE_HOLD:
      closure: 9
      close_frames: 4
      count: 1
      gap_frames: 0
    SLOW_BLINK:
      closure: 8
      close_frames: 5
      hold_frames: 4
      open_frames: 6
      count: 1
      gap_frames: 0

maya_fixation_micro_saccade:
  enabled: true
  control_suffix: CNT_BOTH_EYES
  x_attribute: translateX
  y_attribute: translateY
  move_frames: 2
  hold_frames: 10
  points:
    A: [-0.28, 0.10]
    B: [0.00, -0.18]
    C: [0.24, 0.08]

maya_head_overlay:
  control_suffix: jNeck_ctl
  attack_frames: 15
  settle_frames: 10
  overshoot_ratio: 0.20
  strength_degrees:
    SUBTLE: 3
    MEDIUM: 6
    STRONG: 10
  pitch_axis: rotateX
  roll_axis: rotateZ
  pitch_up_sign: -1
  tilt_left_sign: 1

maya_idle_head:
  enabled: true
  control_suffix: jNeck_ctl
  pitch_axis: rotateX
  roll_axis: rotateZ
  max_pitch_degrees: 0.80
  max_roll_degrees: 0.45
  min_waypoint_seconds: 1.4
  max_waypoint_seconds: 2.4
  speech_fade_frames: 6
  speech_resume_frames: 8

maya_affect_overlay:
  transition_frames: 12

maya_performative_blink_overlay:
  central_control_suffix: usr_blink
  central_attribute: LidDown
  left_control_suffix: usr_blink_L
  left_attribute: LidDown_L
  right_control_suffix: usr_blink_R
  right_attribute: LidDown_R
  vendor_output_control_suffix: LIDS_jSync_plusMinus
  vendor_output_attribute: Down_upLids_jSync
  open_value: 0
  idle_regulatory:
    enabled: true
    min_interval_seconds: 3.5
    max_interval_seconds: 6.0
    min_separation_seconds: 0.75
  brow_companion:
    delta: 2
    central_control_suffix: usr_BrowInDown
    central_attribute: BrowDown
    left_control_suffix: usr_BrowInDown_L
    left_attribute: BrowDown_L
    right_control_suffix: usr_BrowInDown_R
    right_attribute: BrowDown_R
  presets:
    BLINK: {closure: 7, close_frames: 2, hold_frames: 1, open_frames: 2, count: 1, gap_frames: 0}
    SLOW_BLINK: {closure: 8, close_frames: 5, hold_frames: 4, open_frames: 6, count: 1, gap_frames: 0}
    DOUBLE_BLINK: {closure: 7, close_frames: 2, hold_frames: 1, open_frames: 2, count: 2, gap_frames: 4}
    # Persistent authored eye closure; EYE_OPEN explicitly releases this state.
    EYE_CLOSE_HOLD: {closure: 9, close_frames: 4, release_frames: 4}

maya_jali_annotation:
  jsync_node: jSync1
  backup_original_transcript: true
  trigger_jsync_compute: true
  # JALI annotation injection should not turn JALI automatic blinks back on.
  # ExpreGaze replaces blink/lid animation later.
  # jali_attribute_overrides:
  #   calculate_blinks: false
